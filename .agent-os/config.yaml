# Agent OS Configuration for IFLA Standards Platform

product:
  name: "IFLA Standards Platform"
  type: "documentation-platform"
  description: "Multi-site documentation and vocabulary management system for library standards"
  version: "1.0.0"
  
technology:
  primary_language: "typescript"
  framework:
    frontend:
      - "docusaurus@3.8.1"
      - "nextjs@15.4.4"
      - "react@19.1.1"
    backend:
      - "trpc@11.4.3"
      - "clerk"
      - "supabase"
  build_system: "nx"
  package_manager: "pnpm"
  testing:
    unit: "vitest"
    e2e: "playwright"
  
structure:
  type: "monorepo"
  workspace_layout:
    apps_dir: "apps"
    libs_dir: "packages"
  main_apps:
    - path: "portal"
      type: "docusaurus"
      description: "Main documentation portal"
    - path: "apps/admin"
      type: "nextjs"
      description: "Admin interface"
    - path: "standards/*"
      type: "docusaurus"
      description: "Individual standard documentation sites"
      
commands:
  dev:
    start_all: "pnpm dev:servers"
    start_portal: "pnpm nx start portal"
    start_admin: "pnpm nx dev admin --turbopack"
  build:
    all: "pnpm build:all"
    affected: "pnpm nx affected --target=build"
  test:
    unit: "pnpm test"
    e2e: "pnpm test:e2e"
    comprehensive: "pnpm test:comprehensive"
  quality:
    lint: "pnpm lint"
    typecheck: "pnpm typecheck"
    
environments:
  local:
    url: "http://localhost:3000"
  preview:
    url: "https://iflastandards.github.io/platform"
  production:
    url: "https://www.iflastandards.info"
    
key_files:
  - "package.json"
  - "nx.json"
  - "CLAUDE.md"
  - "README.md"
  - "apps/admin/next.config.js"
  - "isbdm/docusaurus.config.ts"
  
standards_paths:
  nextjs:
    code_style: ".agent-os/standards/nextjs/code-style.md"
    data_flow: ".agent-os/standards/nextjs/data-flow.md"
    feature_factory: ".agent-os/standards/nextjs/feature-factory.md"
    components: ".agent-os/standards/nextjs/components.md"
    testing: ".agent-os/standards/nextjs/testing.md"
  docusaurus:
    code_style: ".agent-os/standards/docusaurus/code-style.md"
    multi_site: ".agent-os/standards/docusaurus/multi-site.md"
    components: ".agent-os/standards/docusaurus/components.md"
    content_standards: ".agent-os/standards/docusaurus/content-standards.md"
    testing: ".agent-os/standards/docusaurus/testing.md"
  shared:
    git_workflow: ".agent-os/standards/shared/git-workflow.md"
    testing_principles: ".agent-os/standards/shared/testing-principles.md"
    development_workflow: ".agent-os/standards/shared/development-workflow.md"
    accessibility_compliance: ".agent-os/standards/shared/accessibility-compliance.md"
  
workflows:
  development:
    - "Review existing patterns in codebase"
    - "Run affected tests before changes"
    - "Use Nx commands for efficiency"
    - "Follow TypeScript strict mode"
  nextjs_feature_development:
    - "CRITICAL: Check Refine.dev generators FIRST for admin features"
    - "Phase 1: Discovery & Requirements (30min)"
    - "Phase 2: Code Discovery & Analysis (15min)" 
    - "Phase 3: Instant Scaffolding with Refine.dev (5min)"
    - "Phase 4: Iterative Refinement (2-3 hours)"
    - "Phase 5: Backend Implementation (2 hours)"
    - "Phase 6: Testing (1 hour)"
    - "Phase 7: Documentation (1 hour)"
  docusaurus_site_development:
    - "Use centralized theme package patterns"
    - "Follow multi-site architecture"
    - "Implement content standards for MDX"
    - "Test content integrity and components"
  testing:
    - "Tag tests appropriately (@unit, @integration, @e2e)"
    - "Use affected testing strategy"
    - "Follow 5-phase testing approach"
    - "Mock-first development with MSW"
    - "Integration-heavy testing strategy"
  deployment:
    - "Push to preview branch for staging"
    - "Create PR to main for production"
    - "Automated GitHub Pages deployment"
    
agent_capabilities:
  - "code_analysis"
  - "test_execution"
  - "build_optimization"
  - "documentation_generation"
  - "dependency_management"
  - "quality_assurance"
  - "workflow_automation"
  
priorities:
  high:
    - "Test coverage improvement"
    - "Build performance optimization"
    - "Authentication migration completion"
  medium:
    - "Documentation updates"
    - "Dependency updates"
    - "Code refactoring"
  low:
    - "Feature enhancements"
    - "UI improvements"
