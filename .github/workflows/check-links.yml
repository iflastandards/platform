name: Check Docusaurus Links

on:
  workflow_dispatch:
    inputs:
      sites:
        description: 'Sites to check (comma-separated, or "all")'
        required: false
        default: 'all'
        type: string
  schedule:
    # Run daily at 2 AM UTC
    - cron: '0 2 * * *'

jobs:
  check-links:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Get pnpm store directory
        id: pnpm-cache
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path)" >> $GITHUB_OUTPUT

      - name: Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Puppeteer browsers
        run: pnpm exec puppeteer browsers install chrome

      - name: Build required packages
        run: |
          echo "📦 Building dependency packages for link checker..."
          pnpm nx run @ifla/contracts:build
          pnpm nx run @ifla/theme:build

      - name: Clean previous reports
        run: |
          echo "🧹 Cleaning previous link validation reports..."
          rm -rf output/link-validation/
          mkdir -p output/link-validation/

      - name: Check links
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            SITES="${{ github.event.inputs.sites }}"
            echo "🔧 Manual run: checking $SITES sites on preview"
            pnpm check:links "$SITES" preview sitemap
          else
            # Scheduled run: check all sites on preview
            echo "📅 Scheduled check: validating all sites on preview environment"
            pnpm check:links all preview sitemap
          fi

      - name: Upload link check report
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: link-check-report-${{ github.run_number }}
          path: |
            output/link-validation/*.json
            output/link-validation/*.txt
            output/link-validation/*.html
            output/link-validation/index-data.json
          retention-days: 30

      - name: Create issue if broken links found
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = require('path');

            // Read link validation reports from output/link-validation/
            const validationDir = path.join(process.cwd(), 'output', 'link-validation');
            const indexDataFile = path.join(validationDir, 'index-data.json');

            if (!fs.existsSync(indexDataFile)) {
              console.log('No index data file found, skipping issue creation');
              return;
            }

            let indexData = {};
            try {
              indexData = JSON.parse(fs.readFileSync(indexDataFile, 'utf8'));
            } catch (e) {
              console.error('Error parsing index data:', e);
              return;
            }

            // Collect results from all sites
            let totalBrokenLinks = 0;
            let siteResults = [];

            Object.entries(indexData).forEach(([site, siteDataArray]) => {
              if (Array.isArray(siteDataArray) && siteDataArray.length > 0) {
                // Get the most recent run (first item)
                const latestRun = siteDataArray[0];
                const failed = latestRun.failed || 0;

                totalBrokenLinks += failed;
                siteResults.push({
                  site: site.toUpperCase(),
                  passed: latestRun.passed || 0,
                  failed: failed,
                  tested: latestRun.tested || 0,
                  status: failed === 0 ? '✅' : '❌',
                  reportFile: `${site}/${latestRun.filename}`
                });
              }
            });

            // Only create issue if there are broken links
            if (totalBrokenLinks === 0) {
              console.log('✅ No broken links found - skipping issue creation');
              return;
            }

            // Build summary table
            let summary = '### Link Validation Summary\n\n';
            summary += '| Site | Status | Links Tested | Passed | Failed |\n';
            summary += '|------|--------|--------------|--------|--------|\n';

            siteResults.forEach(site => {
              summary += `| ${site.site} | ${site.status} | ${site.tested} | ${site.passed} | ${site.failed} |\n`;
            });

            // Build broken links details
            let brokenLinksDetail = '';
            siteResults.filter(s => s.failed > 0).forEach(site => {
              brokenLinksDetail += `\n### ${site.site}\n`;
              brokenLinksDetail += `- **${site.failed}** broken link${site.failed === 1 ? '' : 's'} found\n`;
              brokenLinksDetail += `- See detailed report in artifacts: \`${site.reportFile}\`\n`;
            });

            // Create issue body
            const artifactUrl = `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}#artifacts`;
            const issueBody =
              `## 🔗 Broken Links Detected\n\n` +
              `${summary}\n\n` +
              `**Total broken links**: ${totalBrokenLinks}\n\n` +
              `${brokenLinksDetail}\n\n` +
              `## 📊 Detailed Reports\n\n` +
              `View the full reports in the [workflow artifacts](${artifactUrl}).\n\n` +
              `---\n` +
              `*Scheduled check run: ${new Date().toISOString()}*`;

            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `🔗 Broken Links Found - ${totalBrokenLinks} link${totalBrokenLinks === 1 ? '' : 's'}`,
              body: issueBody,
              labels: ['documentation', 'broken-links', 'automated']
            });
