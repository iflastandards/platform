version: 3
updates:
  # Non-security npm updates with very conservative schedule
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "monthly"          # keep monthly for regular maintenance
      day: "monday"
      time: "04:00"
    open-pull-requests-limit: 3   # reduce concurrency of PRs
    # Disable automated major version bumps, handled manually
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      nx:
        patterns:
          - "@nx/*"
          - "nx"
          - "nx-cloud"
      docusaurus:
        patterns:
          - "@docusaurus/*"
      mui:
        patterns:
          - "@mui/*"
          - "@emotion/*"
      testing:
        patterns:
          - "*test*"
          - "*vitest*"
          - "*playwright*"
          - "*jest*"

  # Security updates for npm - run immediately or weekly instead of monthly
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "daily"            # to get security fixes ASAP
    allow:
      - dependency-type: "direct"   # can control further by only direct deps if desired
    types:
      - "version-update:security"  # only security updates here

  # Continue handling GitHub Actions security weekly
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "ci"
