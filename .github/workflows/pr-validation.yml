name: Pull Request Validation
# Fast validation for pull requests focusing on documentation changes

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'standards/**'
      - 'packages/theme/**'
      - 'portal/**'
      - '*.json'
      - '*.config.*'
      - '.github/workflows/**'

permissions:
  contents: read
  pull-requests: write
  checks: write

concurrency:
  group: 'pr-validation-${{ github.head_ref }}'
  cancel-in-progress: true

env:
  CI: true
  HUSKY: 0
  NX_DAEMON: true
  NX_PARALLEL: 4
  NODE_OPTIONS: '--max-old-space-size=4096'
  NX_CLOUD_ACCESS_TOKEN: ${{ secrets.NX_CLOUD_ACCESS_TOKEN }}

jobs:
  changes-detection:
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      docs_changed: ${{ steps.filter.outputs.docs }}
      docs_only: ${{ steps.filter.outputs.docs == 'true' && steps.filter.outputs.code == 'false' && steps.filter.outputs.config == 'false' }}
      theme_changed: ${{ steps.filter.outputs.theme }}
      code_changed: ${{ steps.filter.outputs.code }}
      config_changed: ${{ steps.filter.outputs.config }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            docs:
              - 'standards/**/docs/**'
              - 'standards/**/*.md'
              - 'standards/**/*.mdx'
              - 'portal/docs/**'
              - 'portal/**/*.md'
              - 'portal/**/*.mdx'
            code:
              - '**/*.ts'
              - '**/*.tsx'
              - '**/*.js'
              - '**/*.jsx'
              - '!**/*.test.*'
              - '!**/*.spec.*'
              - '!**/docs/**'
            theme:
              - 'packages/theme/**'
            config:
              - '*.json'
              - '*.config.*'
              - 'nx.json'
              - 'project.json'

  validate-code-quality:
    name: Code Quality Checks
    needs: changes-detection
    if: needs.changes-detection.outputs.docs_only != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Cache Nx
        uses: actions/cache@v4
        with:
          path: |
            .nx/cache
            node_modules/.cache/nx
          key: nx-pr-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ hashFiles('nx.json') }}
          restore-keys: |
            nx-pr-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-
            nx-pr-${{ runner.os }}-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --prefer-offline

      - uses: nx-dev/nx-set-shas@v4
        id: nx-set-shas
        with:
          main-branch-name: 'preview' # Use preview as the main branch for base comparison
          # Use the last successful run for better cache hits
          last-successful-event: 'push'

      - name: Format check
        run: |
          echo "🎨 Checking code formatting..."
          NX_CLOUD_DISTRIBUTED_EXECUTION=false npx nx format:check --base=${{ steps.nx-set-shas.outputs.base }}

      - name: Lint affected
        run: |
          echo "🔍 Linting affected projects..."
          # Disable distributed execution - module resolution issues
          NX_CLOUD_DISTRIBUTED_EXECUTION=false npx nx affected --target=lint \
            --base=${{ steps.nx-set-shas.outputs.base }} \
            --exclude=admin \
            --parallel=6

      - name: Type check affected
        run: |
          echo "📝 Type checking affected projects..."
          # Disable distributed execution - module resolution issues
          NX_CLOUD_DISTRIBUTED_EXECUTION=false npx nx affected --target=typecheck \
            --base=${{ steps.nx-set-shas.outputs.base }} \
            --exclude=admin \
            --parallel=6

  test-affected:
    name: Test Affected Projects
    needs: changes-detection
    if: needs.changes-detection.outputs.docs_only != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Restore Nx cache
        uses: actions/cache@v4
        with:
          path: |
            .nx/cache
            node_modules/.cache/nx
          key: nx-pr-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ hashFiles('nx.json') }}
          restore-keys: |
            nx-pr-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-
            nx-pr-${{ runner.os }}-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --prefer-offline

      - uses: nx-dev/nx-set-shas@v4
        id: nx-set-shas
        with:
          main-branch-name: 'preview' # Use preview as the main branch for base comparison
          # Use the last successful run for better cache hits
          last-successful-event: 'push'

      - name: Run affected tests
        run: |
          echo "🧪 Testing affected projects..."
          # Disable Nx Cloud distributed execution for tests
          # Tests fail on distributed agents due to module resolution issues
          NX_CLOUD_DISTRIBUTED_EXECUTION=false npx nx affected --target=test \
            --base=${{ steps.nx-set-shas.outputs.base }} \
            --exclude=admin \
            --parallel=6

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage/lcov.info
          flags: documentation
          name: pr-documentation-coverage

  build-preview:
    name: Build Preview
    needs: [changes-detection, validate-code-quality, test-affected]
    if: |
      always() &&
      needs.changes-detection.result == 'success' &&
      (needs.validate-code-quality.result == 'success' || needs.validate-code-quality.result == 'skipped') &&
      (needs.test-affected.result == 'success' || needs.test-affected.result == 'skipped')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Restore Nx cache
        uses: actions/cache@v4
        with:
          path: |
            .nx/cache
            node_modules/.cache/nx
          key: nx-pr-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ hashFiles('nx.json') }}
          restore-keys: |
            nx-pr-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-
            nx-pr-${{ runner.os }}-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --prefer-offline

      - uses: nx-dev/nx-set-shas@v4
        id: nx-set-shas
        with:
          main-branch-name: 'preview' # Use preview as the main branch for base comparison
          # Use the last successful run for better cache hits
          last-successful-event: 'push'

      - name: Build affected projects
        run: |
          echo "🏗️ Building affected projects (including dependencies)..."
          # Nx will automatically build dependencies first when needed
          # Using higher parallelism and letting Nx handle the dependency graph
          NX_CLOUD_DISTRIBUTED_EXECUTION=false npx nx affected --target=build \
            --base=${{ steps.nx-set-shas.outputs.base }} \
            --exclude=admin \
            --parallel=6
        env:
          DOCS_ENV: preview

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: pr-build-${{ github.event.pull_request.number }}
          path: |
            portal/build
            standards/*/build
          retention-days: 7

  check-build-warnings:
    name: Check Build Warnings
    needs: [build-preview]
    # Always run but don't block - using success() || failure() in pr-summary
    if: |
      always() &&
      needs.build-preview.result == 'success'
    uses: ./.github/workflows/check-warnings.yml
    permissions:
      contents: read
      issues: write
      pull-requests: write

  pr-summary:
    name: PR Summary Report
    needs:
      [
        changes-detection,
        validate-code-quality,
        test-affected,
        build-preview,
        check-build-warnings,
      ]
    # Run even if warnings check fails - it's non-blocking
    if: |
      always() &&
      needs.changes-detection.result == 'success' &&
      (needs.check-build-warnings.result == 'success' || needs.check-build-warnings.result == 'failure')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            nx.json
            package.json
            pnpm-lock.yaml
            .npmrc
          sparse-checkout-cone-mode: false

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Fix CI Configuration with AI
        run: |
          npx nx-cloud fix-ci
        if: always()
        continue-on-error: true

      - name: Generate PR comment
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const botComment = comments.find(comment => 
              comment.user.type === 'Bot' && 
              comment.body.includes('## PR Validation Report')
            );

            const body = `## PR Validation Report

            ### ✅ Checks Completed
            - Code Quality: ${{ needs.validate-code-quality.result }}
            - Tests: ${{ needs.test-affected.result }}
            - Build: ${{ needs.build-preview.result }}
            - Lighthouse: ${{ needs.lighthouse-audit.result }}

            ### 📊 Summary
            - **Affected Projects**: Check Nx affected output
            - **Test Coverage**: Available in artifacts
            - **Build Artifacts**: Available for preview
            - **Lighthouse Scores**: Check workflow summary

            ### 🚀 Optimizations Applied
            - Nx affected detection for incremental validation
            - Parallel execution of checks
            - Build caching enabled
            - Admin tests excluded (documentation focus)

            ---
            *This comment is automatically updated on each push*`;

            if (botComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComment.id,
                body
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body
              });
            }
