name: Check Docusaurus Links

on:
  workflow_run:
    workflows: ['Nx Optimized Documentation Deploy']
    types:
      - completed
    branches:
      - preview
      - main
  workflow_dispatch:
    inputs:
      sites:
        description: 'Sites to check (comma-separated, or "all")'
        required: false
        default: 'all'
        type: string
      verbose:
        description: 'Enable verbose output'
        required: false
        default: false
        type: boolean
  schedule:
    # Run daily at 2 AM UTC (same as Lighthouse)
    - cron: '0 2 * * *'

jobs:
  check-links:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Only run if deployment succeeded, or manually triggered, or on schedule
    if: github.event.workflow_run.conclusion == 'success' || github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Get pnpm store directory
        id: pnpm-cache
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path)" >> $GITHUB_OUTPUT

      - name: Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      - name: Build required packages
        run: |
          echo "📦 Building dependency packages for link checker..."
          pnpm nx run @ifla/contracts:build
          pnpm nx run @ifla/theme:build

      - name: Check links (workflow dispatch)
        if: github.event_name == 'workflow_dispatch'
        run: |
          SITES="${{ github.event.inputs.sites }}"
          VERBOSE="${{ github.event.inputs.verbose }}"

          if [ "$SITES" = "all" ]; then
            if [ "$VERBOSE" = "true" ]; then
              pnpm check:links:all --verbose
            else
              pnpm check:links:all
            fi
          else
            if [ "$VERBOSE" = "true" ]; then
              pnpm check:links:site "$SITES" --verbose
            else
              pnpm check:links:site "$SITES"
            fi
          fi

      - name: Check links (automatic)
        if: github.event_name != 'workflow_dispatch'
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            # Daily schedule: check all sites on preview
            echo "📅 Daily check: validating all sites on preview environment"
            pnpm check:links all preview sitemap
          elif [ "${{ github.event_name }}" = "workflow_run" ] && [ "${{ github.event.workflow_run.head_branch }}" = "main" ]; then
            # Main branch deployment: check all sites on production
            echo "🚀 Main deployment: validating all sites on production"
            pnpm check:links all production sitemap
          else
            # Preview deployment: check only affected sites
            echo "🔍 Preview deployment: checking affected sites only"
            AFFECTED=$(pnpm nx show projects --affected --type app 2>/dev/null | \
              grep -E '^(portal|ISBDM|LRM|FRBR|isbd|muldicat|unimarc)$' | \
              tr '\n' ',' | sed 's/,$//')

            if [ -n "$AFFECTED" ]; then
              echo "📊 Affected sites: $AFFECTED"
              pnpm check:links "$AFFECTED" preview sitemap
            else
              echo "ℹ️  No affected documentation sites to check"
            fi
          fi

      - name: Upload link check report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: link-check-report-${{ github.run_number }}
          path: |
            output/link-validation/*.json
            output/link-validation/*.txt
            output/link-validation/*.html
            output/link-validation/index-data.json
          retention-days: 30

      - name: Comment PR with results
        if: github.event.workflow_run.event == 'pull_request' && always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = require('path');

            // Read link validation reports from output/link-validation/
            const validationDir = path.join(process.cwd(), 'output', 'link-validation');
            const indexDataFile = path.join(validationDir, 'index-data.json');

            let indexData = {};
            let totalBrokenLinks = 0;
            let siteResults = [];

            if (fs.existsSync(indexDataFile)) {
              try {
                indexData = JSON.parse(fs.readFileSync(indexDataFile, 'utf8'));

                // Process each site's results
                Object.entries(indexData).forEach(([site, data]) => {
                  if (data.results) {
                    const failed = data.results.failedLinks || 0;
                    totalBrokenLinks += failed;
                    siteResults.push({
                      site: site.toUpperCase(),
                      passed: data.results.passedLinks || 0,
                      failed: failed,
                      total: data.results.totalLinks || 0,
                      status: failed === 0 ? '✅' : '❌',
                      reportFile: data.reportFile
                    });
                  }
                });
              } catch (e) {
                console.error('Error parsing index data:', e);
              }
            }

            if (siteResults.length > 0) {
              // Build summary table
              let summary = '### Link Validation Summary\n\n';
              summary += '| Site | Status | Links Tested | Passed | Failed |\n';
              summary += '|------|--------|--------------|--------|--------|\n';

              siteResults.forEach(site => {
                summary += `| ${site.site} | ${site.status} | ${site.total} | ${site.passed} | ${site.failed} |\n`;
              });

              // Create comment
              const comment = `## 🔗 Link Check Results

              ${summary}

              ${totalBrokenLinks > 0
                ? `⚠️ **Action Required**: ${totalBrokenLinks} broken link${totalBrokenLinks === 1 ? '' : 's'} found. Please fix before merging.`
                : '✅ All links are valid!'}

              📊 [View detailed reports in artifacts](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}#artifacts)`;

              // Find the PR number from the workflow run
              const workflowRun = context.payload.workflow_run;
              if (workflowRun && workflowRun.pull_requests && workflowRun.pull_requests.length > 0) {
                const prNumber = workflowRun.pull_requests[0].number;

                await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: prNumber,
                  body: comment
                });
              }
            }
